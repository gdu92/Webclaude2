<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f5;
        }

        header {
            background-color: #c0392b;
            color: #fff;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.5rem;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 1rem;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 700px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .hero {
            text-align: center;
            background-color: #fff;
            padding: 3rem 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .hero h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #c0392b;
        }

        .hero p {
            font-size: 1.1rem;
            color: #555;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: #777;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Mon Site</h1>
        <nav>
            <a href="accueil.html">Accueil</a>
            <a href="index.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h2>Bienvenue sur mon site !</h2>
            <p>Merci de votre visite. N'hésitez pas à explorer les différentes pages et à me contacter si vous avez des questions.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Guillaume Durand - Tous droits réservés</p>
    </footer>
</body>
</html>
